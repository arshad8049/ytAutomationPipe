name: Daily Zeno Short

on:
  schedule:
    - cron: "0 14 * * *" # 14:00 UTC daily
  workflow_dispatch: # allows manual "Run workflow" for testing, or a one-off manual-injection run
    inputs:
      topic:
        description: "Override today's topic (leave blank for the normal auto-rotation)"
        required: false
        default: ""
      cta:
        description: "Point the script's closing line at this, e.g. a specific main video"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: short_automation
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ secrets.CLAUDE_MODEL }}
          HEYGEN_API_KEY: ${{ secrets.HEYGEN_API_KEY }}
          HEYGEN_AVATAR_ID: ${{ secrets.HEYGEN_AVATAR_ID }}
          HEYGEN_VOICE_ID: ${{ secrets.HEYGEN_VOICE_ID }}
          HEYGEN_ENGINE: ${{ secrets.HEYGEN_ENGINE }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          NOTIFY_EMAIL_FROM: ${{ secrets.NOTIFY_EMAIL_FROM }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
          TOPIC_SEED: ${{ secrets.TOPIC_SEED }}
          MANUAL_TOPIC: ${{ github.event.inputs.topic }}
          MANUAL_CTA: ${{ github.event.inputs.cta }}
        run: python main.py --topic "$MANUAL_TOPIC" --cta "$MANUAL_CTA"

      - name: Persist run log
        if: always()
        run: |
          git config user.name "zeno-shorts-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/log.csv
          git diff --cached --quiet || git commit -m "Log run for $(date -u +%F)"
          git push
